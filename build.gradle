plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven {
		name = "RedlanceMinecraft"
		url = uri("https://repo.redlance.org/public")
	}
	maven {
		name = "Gegy"
		url = uri("https://maven.gegy.dev/releases/")
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "brightestday"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation("com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.pal_version}")
	compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynamiclights_version}")
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

base {
	archivesName = "brightestday"
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "${project.release_stage}-${project.version}"
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

def versionProperties = file("gradle.properties")
def builtVersion = project.version.toString()

tasks.register("bumpVersion") {
	description = "Increments the patch version in gradle.properties after a successful build."
	def propertiesFile = versionProperties
	def current = builtVersion
	doLast {
		def parts = current.tokenize(".")
		parts[-1] = ((parts[-1] as int) + 1).toString()
		def next = parts.join(".")
		propertiesFile.text = propertiesFile.text.replaceFirst(/(?m)^version=.*$/, "version=${next}")
		println "Built ${current}; next build will be ${next}"
	}
}

tasks.named("build") {
	finalizedBy("bumpVersion")
}

loom {
	runs {
		client {
			environmentVariable "SDL_VIDEO_DRIVER", "wayland"
			environmentVariable "__EGL_VENDOR_LIBRARY_FILENAMES", "/run/opengl-driver/share/glvnd/egl_vendor.d/50_mesa.json"
			environmentVariable "MESA_LOADER_DRIVER_OVERRIDE", "zink"
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
